version: '3.8'

services:
  devcraft-pwa:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: always
    container_name: devcraft_app
    networks:
      - tunnel-net

  # ── Cloudflare Tunnel (exposes the app publicly via Cloudflare) ──
  # Option A  – Named tunnel (production):
  #   1. Go to https://one.dash.cloudflare.com → Networks → Tunnels → Create
  #   2. Copy the tunnel token and set CLOUDFLARE_TUNNEL_TOKEN in .env
  #   3. In the tunnel config, add a public hostname pointing to http://devcraft-pwa:80
  #
  # Option B  – Quick tunnel (demo / testing, no token needed):
  #   Replace the `command` below with:
  #     command: tunnel --no-autoupdate --url http://devcraft-pwa:80
  #   A temporary *.trycloudflare.com URL will be printed in the logs.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: devcraft_tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - devcraft-pwa
    networks:
      - tunnel-net

networks:
  tunnel-net:
    driver: bridge
